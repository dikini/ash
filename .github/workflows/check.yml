name: Check website

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://dikini.github.io
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser and study diagram system dependencies
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - uses: actions/cache/restore@v4
        id: publications
        with:
          path: |
            .cache/ash-doc
            .cache/ash-spec/source
          key: ${{ runner.os }}-publications-${{ hashFiles('scripts/prepare-study.mjs', 'scripts/study-tools.mjs', 'scripts/prepare-spec.mjs') }}
          restore-keys: ${{ runner.os }}-publications-
      - run: npm run check
      - run: npm run build
      - name: Cache prepared publications after a successful build
        if: steps.publications.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/ash-doc
            .cache/ash-spec/source
          key: ${{ steps.publications.outputs.cache-primary-key }}
      - run: npm test
      - run: npm run test:browser
        env:
          ASH_VISUAL_BASELINE: ubuntu
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-diagnostics
          path: test-results/
          if-no-files-found: ignore
      - name: Prepare GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: npm run prepare:pages
        env:
          PAGES_URL: https://dikini.github.io/ash/
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .cache/github-pages/ash/
      - uses: actions/upload-artifact@v4
        with:
          name: ash-site-preview
          path: dist/
          if-no-files-found: error

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Read compiler checkpoint
        id: compiler
        run: node --input-type=module -e "import fs from 'node:fs'; import {readSourceConfig,repositoryWebUrl} from './scripts/source-config.mjs'; const c=readSourceConfig().config; const p=c.checkpoint; const repo=repositoryWebUrl(c.repositories[p.source].repository).replace('https://github.com/',''); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'revision='+p.revision+'\ntoolchain='+p.toolchain+'\nrepository='+repo+'\n');"
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.compiler.outputs.repository }}
          ref: ${{ steps.compiler.outputs.revision }}
          path: .compiler
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
        env:
          RUST_TOOLCHAIN: ${{ steps.compiler.outputs.toolchain }}
      - run: npm run verify:examples
        env:
          ASH_SOURCE: ${{ github.workspace }}/.compiler

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [website, examples]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
